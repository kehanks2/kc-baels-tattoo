<nav class="filter-bar" aria-label="Filter portfolio by style">
  @for (option of options; track option.link) {
    <a
      class="filter-btn"
      [routerLink]="option.link"
      [class.active]="active() === option.slug"
      [attr.aria-current]="active() === option.slug ? 'page' : null"
    >
      {{ option.label }}
    </a>
  }
</nav>
