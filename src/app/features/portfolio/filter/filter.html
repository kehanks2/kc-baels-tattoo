<nav class="filter-bar" aria-label="Filter portfolio by style">
  @for (option of options; track option.href) {
    <a
      class="filter-btn"
      [href]="option.href"
      [class.active]="active() === option.slug"
      [attr.aria-current]="active() === option.slug ? 'true' : null"
      (click)="select($event, option.slug)"
    >
      {{ option.label }}
    </a>
  }
</nav>
